name: Release

# Se dispara al subir una etiqueta vX.Y.Z creada desde main.
# "Run workflow" (workflow_dispatch) hace un ensayo: construye todo, no publica nada.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verificar y construir
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: La etiqueta debe estar en main
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::La etiqueta ${GITHUB_REF_NAME} no apunta a un commit de main."
            exit 1
          fi

      - run: npm ci

      - name: Versión, etiqueta y CHANGELOG coherentes
        id: meta
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npx tsx scripts/release.ts check "$TAG"

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:translations
      - run: npm run build

      - name: Tests de integración (VS Code real)
        run: |
          for intento in 1 2 3; do
            xvfb-run -a npm run test:integration && exit 0
            echo "::warning::Intento $intento de los tests de integración falló"
          done
          exit 1

      - name: Empaquetar .vsix
        run: npm run package

      - name: Construir la librería npm
        run: |
          npm run build:lib
          npm run smoke:lib

      - name: Notas de la versión
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: npx tsx scripts/release.ts notes "$VERSION" > release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-vsix
          path: "*.vsix"
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-lib
          path: dist-lib
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  github-release:
    name: GitHub Release
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-vsix
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Crear el release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flag=""
          if [ "$PRERELEASE" = "true" ]; then flag="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" ./*.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md $flag

  # La publicación en el Marketplace y en npm es opcional: solo corre si existen las
  # variables del repositorio PUBLISH_MARKETPLACE / PUBLISH_NPM con valor "true" (y sus
  # secretos). Sin ellas, el release solo crea el GitHub Release con el .vsix.
  # El Marketplace no acepta versiones con sufijo (1.2.3-beta.1):
  # las pre-releases solo van a npm (tag "next") y a GitHub.
  publish-marketplace:
    name: Visual Studio Marketplace
    needs: verify
    if: github.ref_type == 'tag' && needs.verify.outputs.prerelease == 'false' && vars.PUBLISH_MARKETPLACE == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: release-vsix
      - name: Publicar
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Falta el secreto VSCE_PAT; no se publicó en el Marketplace."
            exit 1
          fi
          npx vsce publish --packagePath ./*.vsix

  # Usa "trusted publishing" de npm (OIDC): no hay token. Configuración en npmjs.com
  # → lupa-a11y-core → Settings → Trusted Publisher (ver docs/flujo-de-trabajo.md).
  publish-npm:
    name: npm (lupa-a11y-core)
    needs: verify
    if: github.ref_type == 'tag' && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC para trusted publishing y provenance
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm reciente (trusted publishing requiere npm 11.5.1 o superior)
        run: npm install -g npm@latest
      - uses: actions/download-artifact@v8
        with:
          name: release-lib
          path: dist-lib
      - name: Publicar
        env:
          NPM_TAG: ${{ needs.verify.outputs.npm_tag }}
        run: |
          version=$(node -p "require('./dist-lib/package.json').version")
          if npm view "lupa-a11y-core@$version" version >/dev/null 2>&1; then
            echo "::notice::lupa-a11y-core@$version ya está publicada en npm; se omite."
            exit 0
          fi
          npm publish ./dist-lib --access public --tag "$NPM_TAG"
