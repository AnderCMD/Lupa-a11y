name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:translations
      - run: npm run build

      - name: Librería npm (lupa-a11y-core)
        run: |
          npm run build:lib
          npm run smoke:lib
          npm pack ./dist-lib --dry-run

      - name: Cache VS Code para los tests de integración
        uses: actions/cache@v6
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Tests de integración (VS Code real)
        run: |
          for intento in 1 2 3; do
            xvfb-run -a npm run test:integration && exit 0
            echo "::warning::Intento $intento de los tests de integración falló"
          done
          exit 1

      - name: Empaquetar .vsix
        run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: lupa-a11y-vsix
          path: "*.vsix"
          if-no-files-found: error

  # Igual que en RizomaDB: busca secretos en todo el historial (check obligatorio en main).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
