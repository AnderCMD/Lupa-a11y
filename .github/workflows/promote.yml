name: Promover dev a main

# Abre (o encuentra) el PR que lleva dev a main. La CI debe pasar antes de
# mezclarlo; las versiones salen de las etiquetas vX.Y.Z (release.yml).
on: workflow_dispatch

permissions:
  contents: read
  pull-requests: write

jobs:
  abrir-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Abrir el PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(git rev-list --count origin/main..origin/dev)" = "0" ]; then
            echo "dev no tiene nada que main no tenga."
            exit 0
          fi
          existing=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Ya hay un PR abierto: #$existing."
            exit 0
          fi
          gh pr create --base main --head dev --title "Promover dev a main" \
            --body "Lleva dev a main. La CI debe pasar antes de mezclarlo (merge commit). Las versiones salen de las etiquetas vX.Y.Z con el workflow Release."
